name: Tests

on:
  push:
    branches:
      - main
      - v*-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.10.10
          cache: pip
          cache-dependency-path: requirements-ci-quality.txt
      - name: Install pinned quality tools
        run: make install-ci-quality
      - name: Check code quality
        run: make quality

  tests:
    name: CPU unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: 3.10.10
          cache: pip
          cache-dependency-path: requirements-ci-tests.txt
      - name: Install CPU test dependencies
        run: make install-ci-tests
      - name: Build installable package
        run: make package
      - name: Run unit tests
        run: make test

